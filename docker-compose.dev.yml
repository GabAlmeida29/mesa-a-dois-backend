services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
      POSTGRES_DB: mesa_a_dois
    ports:
      - '5433:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata-dev:
